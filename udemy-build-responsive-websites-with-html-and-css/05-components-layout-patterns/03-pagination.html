<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    
    <style>
        /*
        COLOR system:
        https://yeun.github.io/open-color/#teal
        - MAIN COLOR: #087f5b (TEAL 9)
        - GREY COLOR: #343a40 (grey 8)
        */
        
        /*
        ICONS: https://heroicons.com/
        */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Inter", sans-serif;
            color: #343a40;
        }
        
        .pagination {
            width: 600px;
            margin: 100px auto;

            display: flex;
            justify-items: center;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            border-radius: 50%;
            cursor: pointer;
        }

        .btn-arr {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: #fff;
            border: 1px solid #087f5b;
            color: #087f5b;
        }

        .btn-arr:hover {
            border: none;
            background-color: #087f5b;
            color: #fff;
        }

        .btn--number {
            height: 36px;
            width: 36px;
            font-size: 18px;
            border: none;
            background-color: #fff;
            color: #343a40;
        }

        .btn--number:hover,
        .btn--number:active,
        .btn--number--active {
            background-color: #087f5b;
            color: #fff;
        }

        .btn--icon {
            height: 24px;
            width: 24px;
            /* stroke: #087f5b; */
            border-radius: 50%;
        }

    </style>
    
    <title>Pagination Component</title>
</head>
<body>
    <div class="pagination">
        <button class="btn btn-arr btn--left">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="btn--icon">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
            </svg>
        </button>
        
        <button class="btn btn--number">1</button>
        <button class="btn btn--number">2</button>
        <button class="btn btn--number btn--number--active">3</button>
        <button class="btn btn--number">4</button>
        <button class="btn btn--number">5</button>
        <button class="btn btn--number">6</button>
        <p class="dots">...</p>
        <button class="btn btn--number">23</button>

        <button class="btn btn-arr btn--right">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="btn--icon">
                <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
            </svg>
        </button>
    </div>
</body>
</html>
